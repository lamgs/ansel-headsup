# Paste into https://api.slack.com/apps → Create New App → From an app manifest.
# Socket Mode: no public URL needed, the app runs on a laptop.
display_information:
  name: Ansel Heads-Up (demo)
  description: Private pre-meeting notes from meetings you attended.
  background_color: "#3B3F9E"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Ansel
    always_online: true
  slash_commands:
    - command: /headsup
      description: Heads-Up demo controls
      usage_hint: "demo [persona] | check [persona] | next"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
