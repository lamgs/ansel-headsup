# Apply in https://api.slack.com/apps → your app → App Manifest (paste, Save Changes).
# Socket Mode: no public URL needed. The service runs on one always-on host (see README).
display_information:
  name: Ansel Heads-Up (demo)
  description: A private note before your recurring meetings, from the meetings you attended.
  background_color: "#3B3F9E"
  long_description: |
    Ansel Heads-Up sends you a short, private note 30 minutes before a recurring meeting. It is drawn only from earlier meetings in the same series that you attended, and shows the action items you own, plus how many more the team has.

    Each item links back to the moment in the transcript where it was said. If there is nothing for you, Ansel stays quiet. You can mute a series right from the card; open Ansel to make changes.

    How it is triggered: Ansel watches your published Outlook calendar for recurring meetings (Teams links are picked up automatically), or a pilot member can send a demo card from the Home tab with Ping me or Ping everyone.

    Privacy: cards are sent only to you, never to a channel. Only people on the pilot allowlist can use the app. This is a pilot demo: card content comes from seeded demo meetings, not real transcripts, and nothing is written back to your calendar.

    Commands: /headsup demo, /headsup ping, /headsup check, /headsup next.
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Ansel
    always_online: true
  slash_commands:
    - command: /headsup
      description: Heads-Up demo controls
      usage_hint: "demo [persona] | ping | check [persona] | next | clear [all]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:history
      - im:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
